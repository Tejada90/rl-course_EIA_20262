services:
  rl-course:
    build:
      context: .
      dockerfile: docker/Dockerfile

    working_dir: /workspace

    volumes:
      - .:/workspace

    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    stdin_open: true
    tty: true
    init: true

    command: sleep infinity
